<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page non trouvée</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .error-code {
            font-size: clamp(8rem, 20vw, 15rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 50px rgba(255, 107, 107, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
            margin-bottom: 1rem;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 50px rgba(255, 107, 107, 0.5);
            }
            to {
                text-shadow: 0 0 80px rgba(255, 107, 107, 0.8);
            }
        }

        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 1rem;
            font-weight: 700;
            opacity: 0;
            animation: slideInUp 1s ease-out 0.3s forwards;
        }

        .error-message {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            margin-bottom: 2.5rem;
            opacity: 0.9;
            line-height: 1.6;
            opacity: 0;
            animation: slideInUp 1s ease-out 0.6s forwards;
        }

        .btn-home {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: slideInUp 1s ease-out 0.9s forwards;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .btn-home::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-home:hover::before {
            left: 100%;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Particules flottantes en arrière-plan */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s infinite;
        }

        .particle:nth-child(1) {
            width: 10px;
            height: 10px;
            left: 10%;
            animation-delay: 0s;
            animation-duration: 8s;
        }

        .particle:nth-child(2) {
            width: 15px;
            height: 15px;
            left: 30%;
            animation-delay: 1s;
            animation-duration: 6s;
        }

        .particle:nth-child(3) {
            width: 8px;
            height: 8px;
            left: 70%;
            animation-delay: 2s;
            animation-duration: 10s;
        }

        .particle:nth-child(4) {
            width: 12px;
            height: 12px;
            left: 90%;
            animation-delay: 3s;
            animation-duration: 7s;
        }

        .particle:nth-child(5) {
            width: 6px;
            height: 6px;
            left: 50%;
            animation-delay: 4s;
            animation-duration: 9s;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .error-message {
                font-size: 1rem;
                margin-bottom: 2rem;
            }
            
            .btn-home {
                padding: 0.8rem 2rem;
                font-size: 1rem;
            }
        }

        /* Effet de scintillement sur le texte */
        .sparkle {
            position: relative;
            overflow: hidden;
        }

        .sparkle::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 10px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            animation: sparkle 3s infinite;
        }

        @keyframes sparkle {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <!-- Particules flottantes -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <div class="error-code sparkle">404</div>
        <h1 class="error-title">Oups ! Page introuvable</h1>
        <p class="error-message">
            La page que vous recherchez semble avoir pris des vacances...<br>
            Peut-être a-t-elle été déplacée, supprimée ou vous avez tapé une mauvaise adresse ?
        </p>
        <a href="/" class="btn-home">
            ← Retour à l'accueil
        </a>
    </div>

    <script>
        // Animation d'entrée pour les éléments
        document.addEventListener('DOMContentLoaded', function() {
            // Ajouter un effet de parallaxe léger au mouvement de la souris
            document.addEventListener('mousemove', function(e) {
                const container = document.querySelector('.container');
                const x = (e.clientX / window.innerWidth) * 2 - 1;
                const y = (e.clientY / window.innerHeight) * 2 - 1;
                
                container.style.transform = `translate(${x * 10}px, ${y * 10}px)`;
            });
        });
    </script>
</body>
</html>
